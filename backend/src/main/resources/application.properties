spring.application.name=Full Stack Hotel Booking Management System
server.port=8080

# =====================================================================
#  DATABASE  -  CHANGE THESE THREE LINES TO MATCH YOUR POSTGRESQL
#  If the database in the URL does not exist, the app creates it on
#  startup. Tables are then created / updated automatically.
# =====================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_booking_db
spring.datasource.username=postgres
spring.datasource.password= Pradeep@2004

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (use a long random string, at least 32 characters)
app.jwt.secret=change-this-to-a-long-random-secret-key-for-hotel-booking-app
app.jwt.expiration-ms=86400000

# Allowed frontend origin (Vite dev server)
app.cors.allowed-origin=http://localhost:5173

# Default admin account created on first run
app.admin.name=Hotel Admin
app.admin.email=admin@hotel.com
app.admin.password=Admin@123
